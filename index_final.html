<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>JimmyShopp — Mes liens</title>
  <meta name="description" content="Retrouve tous les liens de JimmyShopp au même endroit.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Arial, sans-serif;
      background: #eef0f3;
      color: #080808;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      width: min(100%, 820px);
      margin: 0 auto;
      padding: 58px 22px 42px;
      min-height: 100vh;
    }
    .top {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 54px;
    }
    .share {
      width: 54px;
      height: 54px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 14px rgba(0,0,0,.04);
      font-size: 25px;
      cursor: pointer;
    }
    .profile { text-align: center; }
    .avatar {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      margin: 0 auto 30px;
      background: #d9dde2;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-size: 46px;
      font-weight: 800;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 {
      font-size: clamp(36px, 8vw, 58px);
      line-height: 1;
      margin: 0 0 18px;
      font-weight: 800;
      letter-spacing: -1.8px;
    }
    .bio {
      max-width: 700px;
      margin: 0 auto 42px;
      font-size: clamp(18px, 4.2vw, 27px);
      line-height: 1.38;
      font-weight: 600;
    }
    .links { display: grid; gap: 16px; }
    .link {
      min-height: 112px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 70px;
      background: #fff;
      border-radius: 22px;
      color: #080808;
      text-decoration: none;
      font-size: clamp(19px, 4.5vw, 27px);
      font-weight: 650;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.02);
      transition: transform .15s ease, box-shadow .15s ease;
    }
    .link:active { transform: scale(.985); }
    .icon {
      position: absolute;
      left: 27px;
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      font-size: 31px;
    }
    .dots {
      position: absolute;
      right: 22px;
      color: #858585;
      font-size: 25px;
      letter-spacing: 2px;
    }
    .footer {
      text-align: center;
      margin-top: 28px;
      color: #777;
      font-size: 14px;
    }
    @media (min-width: 700px) {
      .page { padding-top: 70px; }
      .link:hover {
        transform: translateY(-2px);
        box-shadow: 0 7px 22px rgba(0,0,0,.07);
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="top">
      <button class="share" aria-label="Partager" onclick="sharePage()">↗</button>
    </div>

    <section class="profile">
      <div class="avatar" id="avatar"><img src="jimmyshopp-avatar.png" alt="JimmyShopp"></div>
      <h1>JimmyShopp</h1>
      <p class="bio">Retrouve tous mes contacts et mes différents liens au même endroit.</p>
    </section>

    <section class="links" aria-label="Mes liens">
      <a class="link" href="https://t.me/Nono33livr" target="_blank" rel="noopener">
        <span class="icon">✈️</span>
        <span>CONTACT TELEGRAM</span>
        <span class="dots">⋮</span>
      </a>

      <a class="link" href="https://wa.me/33695164625" target="_blank" rel="noopener">
        <span class="icon">💬</span>
        <span>CONTACT WHATSAPP</span>
        <span class="dots">⋮</span>
      </a>
    </section>

    <section class="links" aria-label="Réseaux sociaux">

      <a class="link" style="margin-top:14px;" href="https://t.me/JimmyShopp" target="_blank" rel="noopener">
        <span class="icon">📢</span>
        <span>CANAL TELEGRAM</span>
        <span class="dots">⋮</span>
      </a>

      <a class="link" href="https://www.snapchat.com/add/RapideQuali" target="_blank" rel="noopener">
        <span class="icon">👻</span>
        <span>SNAPCHAT</span>
        <small style="position:absolute;left:0;right:0;bottom:12px;font-size:12px;font-weight:500;color:#777;">RapideQuali</small>
        <span class="dots">⋮</span>
      </a>
    </section>

    <div class="footer">JimmyShopp</div>
  </main>

  <script>
    async function sharePage() {
      const data = {
        title: "JimmyShopp",
        text: "Retrouve tous les liens de JimmyShopp",
        url: window.location.href
      };
      if (navigator.share) {
        try { await navigator.share(data); } catch (e) {}
      } else {
        await navigator.clipboard?.writeText(window.location.href);
        alert("Lien copié !");
      }
    }
  </script>

</body>
</html>
